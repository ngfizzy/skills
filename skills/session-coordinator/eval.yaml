skill: session-coordinator

requires: []

triggers:
  should_load:
    - situation: A user explicitly invokes the session coordinator with a bounded task and asks it to delegate the work through a native session.
      because: Explicit delegation with coordinator accountability is the skill's core case.
    - situation: A user asks the coordinator to replace a degraded worker while preserving verified context, artifacts, and the next action.
      because: Lifecycle recovery and context-preserving replacement are named responsibilities.
    - situation: A user explicitly asks the coordinator to choose a fallback when native session creation is unavailable.
      because: The consent-gated fallback path is part of the skill's invocation contract.

  should_not_load:
    - situation: A user asks for a direct implementation in a repository and does not explicitly invoke a coordinator or request delegation.
      because: The skill is disabled for implicit matching requests.
    - situation: A user asks for a diagnosis of an unclear runtime failure before any delegation decision is made.
      because: Failure diagnosis is a task-specific concern rather than coordination.
    - situation: A user asks for a prose rewrite without asking for delegation, lifecycle management, or a worker.
      because: Editing prose alone does not require coordinator behavior.
    - situation: A user asks for a durable runtime explainer and wants the agent to trace the source directly.
      because: The deliverable and investigation belong to a runtime-documentation workflow unless delegation is explicitly requested.

behaviors:
  - name: Invocation without a task stays inert
    given: The user explicitly invokes the session coordinator with no task, configuration, or question.
    must:
      - Acknowledges coordinator mode only.
      - Asks no question and starts or reuses no worker.
      - Performs no task-specific investigation.

  - name: Native session comes before task work
    given: The user explicitly requests a bounded writing task while a healthy native session capability is exposed.
    must:
      - Discovers the documented native capabilities before task-specific investigation.
      - Treats the host feature matrix as examples and selects only a capability exposed by the current host.
      - Creates or reuses the related native session before inspecting task sources.
      - Delegates an assignment with acceptance criteria and evidence requirements.
    must_not:
      - Investigates or writes the task itself before the delegated session is ready.

  - name: Session model is chosen and reasoning follows complexity
    given: The user starts a coordinator session without naming a model. The host exposes several models and selectable reasoning levels, and the next assignments differ in complexity.
    must:
      - Prompts the user to choose a session model before creating a worker.
      - Keeps the validated choice as the session model until the user changes it.
      - Selects reasoning for each assignment based on its complexity when the host allows it.
      - Validates each complete model and reasoning pair before delegation.
    must_not:
      - Chooses a fixed model or reasoning default without the user's model choice and the task's complexity.

  - name: Empty model catalog stops delegation
    given: The host exposes no usable worker models when the user first assigns coordinator work.
    must:
      - Reports that delegation cannot start because no worker model is available.
      - Leaves worker creation stopped.
    must_not:
      - Asks the user to choose from an empty model list or invents a model.

  - name: Fallback requires consent and preserves scope
    given: Native session creation is unavailable, a named alternative is recommended, and the user has not yet approved it.
    must:
      - Stops task execution and explains the material limitations of the named alternative.
      - Requests explicit permission before starting the alternative.
      - Starts only the approved alternative and preserves the original scope and required approvals.
    must_not:
      - Treats silence, a general task request, or the coordinator's preference as fallback approval.

  - name: Degraded work receives a context-preserving handoff
    given: A worker repeatedly loses context, contradicts verified facts, and misses acceptance criteria while a replacement native session is available.
    must:
      - Treats the worker as degraded rather than restarting from an empty context.
      - Preserves verified facts, artifacts, validation, risks, and incomplete criteria.
      - Gives the replacement one exact next action and supersedes the old worker through its recorded identity.

  - name: Scope and evidence gates remain enforced
    given: A worker reports completion and proposes a commit or destructive action outside its assigned scope or permissions.
    must:
      - Independently checks the worker's evidence against every acceptance criterion.
      - Refuses to infer permission for the out-of-scope action.
      - Separates verified evidence, worker claims, unresolved items, and the next action in the final report.
    must_not:
      - Claims completion from the worker's report alone.
      - Performs or authorizes the out-of-scope action without explicit approval.

  - name: Refusal and no response remain blocked
    given: Native session creation is unavailable, a named alternative is recommended, and the user refuses it or does not respond.
    must:
      - Leaves task execution stopped and reports the task as blocked.
      - Does not start the named alternative or claim completion.
      - Identifies the missing approval as the next decision needed.

  - name: Mid-session choice changes persist
    given: The user changes the coordinator session's model and reasoning choice while an active worker cannot change its settings in place.
    must:
      - Validates the new pair against the host's available settings.
      - Replaces the active worker with a context-preserving handoff.
      - Applies the user's choice to subsequent assignments until the user changes it.
      - Keeps a separately stated one-worker override limited to that worker.
    must_not:
      - Resets the session choice after a single assignment.

  - name: Session choices do not cross sessions
    given: A prior coordinator session used a user-selected model and reasoning level; the user starts a new coordinator session without supplying either choice.
    must:
      - Discovers the current host choices and asks the user to select a model for the new session.
      - Chooses reasoning by assignment complexity unless the user selects a level for the new session.
    must_not:
      - Reads or writes durable memory to reuse the previous session's choices.

  - name: Implicit matches are declined
    given: A routine request matches the skill description, but the user has not explicitly invoked the coordinator or requested delegation.
    must:
      - Declines coordinator behavior and leaves the task to the normal workflow.
      - Does not create or reuse a worker for the implicit request.
      - Does not begin task-specific investigation through this skill.

  - name: Delegation continuity blocks unowned local task work
    given: Delegation mode is active, an acceptance criterion remains unfinished, and the current worker is idle with no healthy worker owning the next criterion. The coordinator is ready to inspect a source file locally.
    must:
      - Verifies that a healthy worker owns the next unfinished criterion before the local inspection.
      - Delegates the next assignment with a clear outcome or stops for explicit consent for a named fallback.
      - Treats the idle worker as neither an owner nor permission to end delegation mode.
    must_not:
      - Performs the local source inspection before the delegation or consent-gated fallback handoff.

  - name: Delegation continuity survives a completed worker checkpoint
    given: A worker checkpoint reports one acceptance criterion complete and another unfinished, but the worker is now completed and no replacement owns the next criterion. The coordinator is about to run task-specific validation locally.
    must:
      - Rechecks worker ownership after the checkpoint and finds no healthy owner for the next unfinished criterion.
      - Delegates the next assignment or a context-preserving replacement handoff before local validation.
      - Keeps delegation mode active while the acceptance criterion remains unfinished.
    must_not:
      - Performs task-specific validation locally before the next assignment or replacement is delegated.

  - name: Delegation continuity ends only after acceptance criteria are exhausted
    given: Delegation mode is active, the worker has completed, and the coordinator has independently verified every acceptance criterion with no unfinished work remaining.
    must:
      - Confirms that no acceptance criterion remains unfinished before ending delegation mode.
      - May report completion without creating unnecessary additional work.
    must_not:
      - Delegates another assignment solely because the worker completed when no acceptance criterion remains.

  - name: Completed objective cannot be reused for unrelated work
    given: A worker completed one objective. A new request has a different objective, artifact set, deliverable, required approvals, and lifecycle, while the old worker remains healthy and idle.
    must:
      - Creates a new native session for the unrelated request.
      - Requires continuation of the same user objective with the same owning repository or artifact set, deliverables, required approvals, and lifecycle before reusing a session.
      - Treats worker health, idleness, familiarity, and configuration correctness as insufficient reasons to reuse a session.
      - Treats the completed session as closed to unrelated work.
    must_not:
      - Reuses the completed worker merely because it is healthy, idle, familiar, or correctly configured.
